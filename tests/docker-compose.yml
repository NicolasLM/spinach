---
services:
    redis:
        image: docker.io/redis:latest
        command: "--appendonly yes"
        ports:
            - "6379:6379"
        volumes:
            - /tmp/redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 5s
            retries: 20
    # Local tests only. Trust authentication avoids putting a password in
    # this file. Production must require SCRAM-SHA-256 and verify-full TLS.
    postgres:
        image: docker.io/postgres:16
        environment:
            POSTGRES_HOST_AUTH_METHOD: trust
            POSTGRES_USER: postgres
            POSTGRES_DB: spinach
        ports:
            - "127.0.0.1:5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d spinach"]
            interval: 2s
            timeout: 5s
            retries: 20
