[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "spinach"
version = "0.0.25"
description = "Modern Redis task queue for Python 3"
readme = "README.rst"
requires-python = ">=3.9"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Nicolas Le Manchet", email = "nicolas@lemanchet.fr" },
]
keywords = ["task queue", "jobs", "redis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "redis",
    "blinker",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-threadleak",
    "pycodestyle",
    "flask",
    "django",
]
# psycopg 3.3 requires Python 3.10. Older interpreters keep 3.2.
postgres = [
    "psycopg[binary]>=3.1,<3.3; python_version < '3.10'",
    "psycopg[binary]>=3.1; python_version >= '3.10'",
    "psycopg_pool>=3.1,<3.3; python_version < '3.10'",
    "psycopg_pool>=3.1; python_version >= '3.10'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-threadleak",
    "pycodestyle",
    "flake8",
    "flask",
    "django",
    # psycopg has no PyPy wheels, so install it only on CPython.
    "psycopg[binary]>=3.1,<3.3; python_version < '3.10' and platform_python_implementation != 'PyPy'",
    "psycopg[binary]>=3.1; python_version >= '3.10' and platform_python_implementation != 'PyPy'",
    "psycopg_pool>=3.1,<3.3; python_version < '3.10' and platform_python_implementation != 'PyPy'",
    "psycopg_pool>=3.1; python_version >= '3.10' and platform_python_implementation != 'PyPy'",
]

[project.urls]
Homepage = "https://github.com/NicolasLM/spinach"
Repository = "https://github.com/NicolasLM/spinach"
Issues = "https://github.com/NicolasLM/spinach/issues"

[tool.coverage.run]
relative_files = true
include = ["spinach/*"]

[tool.pytest.ini_options]
threadleak = true

[tool.uv.build-backend]
module-name = "spinach"
module-root = ""
