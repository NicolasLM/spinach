name: Run tests

on: ["push", "pull_request"]

jobs:

  test:

    # TODO(nic): don't know if it's worth it to keep support for EOL Pythons...
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Lint
      run: |
        uv run pycodestyle --ignore=E252,W503,W504 spinach tests

    - name: Test with pytest
      if: ${{ !contains(matrix.python-version, 'pypy') }}
      env:
        SPINACH_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/spinach
      run: |
        uv run pytest -v --cov=spinach tests/

    - name: Test with pytest
      if: ${{ contains(matrix.python-version, 'pypy') }}
      run: |
        uv run pytest -v --cov=spinach tests/

    - name: Coveralls
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel: true


  coveralls_finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
