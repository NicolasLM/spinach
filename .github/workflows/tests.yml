name: Run tests

on: ["push", "pull_request"]

jobs:

  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "pypy3.10"]

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      # Trust auth is for this CI service only. No password is stored.
      # Production connections must use SCRAM-SHA-256 and verify-full TLS.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: spinach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spinach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [[ "${{ matrix.python-version }}" == pypy* ]]; then
          pip install -e '.[tests]'
        else
          pip install -e '.[tests,postgres]'
        fi

    - name: Lint
      run: |
        pycodestyle --ignore=E252,W503,W504 spinach tests

    - name: Test with pytest
      if: ${{ !contains(matrix.python-version, 'pypy') }}
      env:
        SPINACH_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/spinach
      run: |
        pytest -v --cov=spinach tests/

    - name: Test with pytest
      if: ${{ contains(matrix.python-version, 'pypy') }}
      run: |
        pytest -v --cov=spinach tests/

    - name: Coveralls
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel: true


  coveralls_finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
